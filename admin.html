<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEWCOM - Administración de Clientes</title>
    <script>try { document.documentElement.dataset.theme = localStorage.getItem('newcom_theme') === 'light' ? 'light' : 'dark'; } catch { document.documentElement.dataset.theme = 'dark'; }</script>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/layout.css" />
</head>
<body>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="true" aria-label="Activar tema claro">☀ Tema claro</button>
    <header id="admin-header" class="app-header" hidden>
        <div class="logo">🏐 NEWCOM · Administración</div>
        <nav aria-label="Navegación de administración">
            <a href="index.html" class="nav-btn">← Volver al inicio</a>
            <span class="nav-btn active" style="cursor: default;">Gestión de Clientes</span>
        </nav>
    </header>

    <main id="admin-container" class="container" hidden>
        <section id="view-admin" class="view-section active">
            <h2>Gestión de Clientes / Licencias</h2>
            <div class="panel-control">
                <button id="btn-nuevo-cliente" class="btn-primary">+ Nuevo Cliente</button>
                <button id="btn-actualizar-licencias" class="btn-secondary">Actualizar Licencias</button>
                <button id="btn-limpiar-licencias" class="btn-danger" type="button">Limpiar licencias</button>
            </div>
            <div id="admin-license-form"></div>
            <div id="admin-list" class="grid-cards">
                <!-- Las licencias se cargan aquí -->
                <p>Cargando clientes...</p>
            </div>
        </section>
    </main>

    <script type="module" src="js/adminAccess.js"></script>
</body>
</html>
